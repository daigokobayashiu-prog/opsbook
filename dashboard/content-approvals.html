<title>Opsbook Content Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Opsbook brand: grid-paper header with ghosted gear, black instrument band for the cadence, white 20px cards with amber corner brackets on hover. Amber is reserved for live / needs-human moments. */
:root {
  --bg: #F8F8F8;
  --surface: #FFFFFF;
  --ink: #141414;
  --ink-2: #6D727F;
  --ink-3: #767A84;
  --line: #E4E5E8;
  --line-strong: #BCBDC0;
  --grid: rgba(20,20,20,.04);
  --accent: #FF7A29;
  --accent-ink: #9A3E0C;
  --accent-soft: rgba(255,122,41,.14);
  --band: #141414;
  --band-ink: #FFFFFF;
  --band-2: rgba(255,255,255,.65);
  --band-line: rgba(255,255,255,.16);
  --band-tile: rgba(255,255,255,.06);
  --band-grid: rgba(255,255,255,.035);
  --ok: #17794A;
  --ok-soft: rgba(23,121,74,.12);
  --warn: #8A5A00;
  --warn-soft: rgba(214,150,0,.16);
  --bad: #B3261E;
  --bad-soft: rgba(179,38,30,.10);
  --btn: #0B0B0B;
  --btn-ink: #FFFFFF;
  --f-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --f-body: 'Poppins', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0B0C; --surface: #151517; --ink: #F2F2F3; --ink-2: #A4A8B2; --ink-3: #8D919B;
    --line: #26272B; --line-strong: #43454D; --grid: rgba(255,255,255,.035);
    --accent: #FF8A40; --accent-ink: #FFB487; --accent-soft: rgba(255,138,64,.16);
    --band: #050506; --ok: #4CC38A; --ok-soft: rgba(76,195,138,.14);
    --warn: #F0BE5A; --warn-soft: rgba(240,190,90,.14); --bad: #FF8A80; --bad-soft: rgba(255,138,128,.13);
    --btn: #F2F2F3; --btn-ink: #0B0B0B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0B0C; --surface: #151517; --ink: #F2F2F3; --ink-2: #A4A8B2; --ink-3: #8D919B;
  --line: #26272B; --line-strong: #43454D; --grid: rgba(255,255,255,.035);
  --accent: #FF8A40; --accent-ink: #FFB487; --accent-soft: rgba(255,138,64,.16);
  --band: #050506; --ok: #4CC38A; --ok-soft: rgba(76,195,138,.14);
  --warn: #F0BE5A; --warn-soft: rgba(240,190,90,.14); --bad: #FF8A80; --bad-soft: rgba(255,138,128,.13);
  --btn: #F2F2F3; --btn-ink: #0B0B0B; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.6; margin: 0;
  padding-block: 0 64px; padding-left: 0; padding-right: 0; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ob-gear { display: block; }
@keyframes ob-gear-spin { to { transform: rotate(360deg); } }
@keyframes ob-dot-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.7); } }
.spin { animation: ob-gear-spin 42s linear infinite; transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: reduce) { .spin, .live-dot { animation: none !important; } }

/* Header: grid paper, ghosted gear, corner brackets */
.hero { position: relative; overflow: hidden; background-color: var(--surface);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 48px 48px;
  border-bottom: 1px solid var(--line); padding-block: 36px 40px; padding-top: calc(36px + env(safe-area-inset-top, 0px)); }
.hero-gear-bg { position: absolute; top: 50%; right: -120px; width: 460px; height: 460px; margin-top: -230px; color: var(--ink); opacity: .05; pointer-events: none; }
.hero .wrap { position: relative; display: flex; flex-wrap: wrap; gap: 20px 24px; align-items: end; justify-content: space-between; }
.hero .wrap::before, .hero .wrap::after { content: ""; position: absolute; top: -18px; width: 20px; height: 20px; border-top: 2px solid var(--accent); opacity: .5; pointer-events: none; }
.hero .wrap::before { left: -2px; border-left: 2px solid var(--accent); }
.hero .wrap::after { right: -2px; border-right: 2px solid var(--accent); }
.label { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; font-size: 12px; color: var(--ink); }
.label .mark { width: 18px; height: 18px; color: var(--ink); }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: ob-dot-pulse 2s ease-in-out infinite; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(32px, 6vw, 52px); line-height: 1.1; letter-spacing: -.02em; margin: 14px 0 8px; text-wrap: balance; }
.lede { margin: 0; color: var(--ink-2); max-width: 52ch; font-size: 15px; }
.weeknav { display: flex; align-items: center; gap: 8px; }
.weeknav .wk { font-family: var(--f-mono); font-size: 13px; font-weight: 600; min-width: 190px; text-align: center; }
.weeknav .wk small { display: block; color: var(--ink-3); font-size: 11px; font-weight: 400; letter-spacing: .04em; }
.iconbtn { width: 40px; height: 40px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 10px; transition: all .25s ease; }
.iconbtn:hover { border-color: var(--accent); color: var(--accent-ink); }

/* Cadence band: black instrument section */
.band { background-color: var(--band); color: var(--band-ink);
  background-image: linear-gradient(var(--band-grid) 1px, transparent 1px), linear-gradient(90deg, var(--band-grid) 1px, transparent 1px); background-size: 48px 48px; padding-block: 28px; }
.band .label { color: var(--band-2); margin-bottom: 16px; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.sum { background: var(--band-tile); border: 1px solid var(--band-line); border-radius: 12px; padding: 16px 18px; }
.sum .lbl { font-family: var(--f-mono); font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: var(--band-2); }
.sum .val { font-family: var(--f-mono); font-size: 30px; font-weight: 700; color: var(--accent); margin-top: 4px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.sum .val span { font-size: 12px; font-weight: 500; color: var(--band-2); letter-spacing: .03em; }
.sum .meta { color: var(--band-2); margin-top: 8px; }
.meter { display: flex; gap: 4px; margin-top: 10px; }
.meter i { flex: 1; height: 6px; border-radius: 3px; background: var(--band-line); }
.meter i.ok { background: #4CC38A; }
.meter i.pending { background: var(--accent); }
.meter i.changes { background: #F0BE5A; }

main { padding-block: 40px 0; }
.banner { background: var(--accent-soft); color: var(--accent-ink); border-radius: 10px; padding: 10px 14px; margin-top: 24px; font-size: 13px; }
.lane { margin-bottom: 44px; }
.lane h2 { font-family: var(--f-mono); font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; margin: 0 0 16px; display: flex; gap: 10px; align-items: center; color: var(--ink); }
.lane h2 .idx { color: var(--accent-ink); font-weight: 700; }
.lane h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.cards { display: grid; gap: 16px; }
.cards.social { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 14px; min-width: 0; transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease; }
.card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 16px 40px rgba(255,122,41,.12); }
.card::before, .card::after { content: ""; position: absolute; width: 14px; height: 14px; opacity: 0; transition: opacity .25s ease; pointer-events: none; }
.card::before { top: 10px; left: 10px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
.card::after { bottom: 10px; right: 10px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }
.card:hover::before, .card:hover::after, .card:focus-within::before, .card:focus-within::after { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .card:hover { transform: none; } }
.index-tag { font-family: var(--f-mono); font-weight: 600; letter-spacing: .15em; text-transform: uppercase; font-size: 11px; color: var(--ink-3); }
.index-tag .idx { color: var(--accent-ink); font-weight: 700; }
.card .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.meta { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.pill { font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
.pill.pending { background: var(--accent-soft); color: var(--accent-ink); }
.pill.pending::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.pill.approved { background: var(--ok-soft); color: var(--ok); }
.pill.changes { background: var(--warn-soft); color: var(--warn); }
.pill.rejected { background: var(--bad-soft); color: var(--bad); }
.card h3 { font-family: var(--f-display); font-weight: 600; font-size: 24px; line-height: 1.25; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.body { white-space: pre-wrap; color: var(--ink-2); font-size: 15px; line-height: 1.7; max-width: 68ch; overflow-wrap: anywhere; }
.card[data-kind="social"] .body { color: var(--ink); }
.body.clamp { display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
.more { align-self: start; background: none; border: 0; padding: 0; color: var(--accent-ink); font-family: var(--f-mono); font-size: 13px; font-weight: 600; }
.more:hover { text-decoration: underline; }
.note { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; font-size: 14px; color: var(--ink-2); }
.note b { font-family: var(--f-mono); font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: var(--accent-ink); display: block; }
textarea, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 12px; }
textarea:focus, input[type=text]:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { min-height: 150px; resize: vertical; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line-strong); background: transparent; color: var(--ink); border-radius: 10px; padding: 9px 18px; font-weight: 600; font-size: 13.5px; transition: all .25s ease; }
.btn:hover { border-color: var(--accent); color: var(--accent-ink); }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn.primary:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--btn-ink); box-shadow: 0 14px 30px rgba(255,122,41,.28); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.empty { background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 16px; padding: 28px; color: var(--ink-2); }
.empty b { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(20px, env(safe-area-inset-bottom, 0px)); background: var(--btn); color: var(--btn-ink); padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; z-index: 20; border: 1px solid var(--accent); }
@media (max-width: 520px) { .weeknav { width: 100%; } .weeknav .wk { min-width: 0; flex: 1; } .card { padding: 22px; } .hero-gear-bg { right: -200px; } }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="ob-gear" viewBox="0 0 510 510">
      <circle cx="255" cy="255" r="248" fill="none" stroke="currentColor" stroke-width="7"/>
      <path fill="none" stroke="currentColor" stroke-width="11" d="M442.84,296.83l-40.58,6.08c-8.89,17.66-12.14,24.12-21.03,41.78l19.29,36.21c-23.1,19.93-19.18,16.55-42.28,36.49l-33-24.39c-18.78,6.2-25.63,8.48-44.41,14.69l-11.96,39.26c-30.43-2.25-25.28-1.87-55.71-4.1l-6.07-40.58c-17.67-8.89-24.12-12.14-41.79-21.03l-36.22,19.31c-19.93-23.11-16.55-19.2-36.49-42.3l24.39-32.98c-6.2-18.79-8.47-25.65-14.69-44.42l-39.24-11.96c2.24-30.43,1.85-25.27,4.09-55.7l40.58-6.08c8.89-17.67,12.14-24.12,21.03-41.79l-19.29-36.2c23.1-19.93,19.19-16.57,42.28-36.5l33,24.39c18.78-6.2,25.63-8.47,44.41-14.67l11.96-39.26c30.43,2.24,25.28,1.85,55.71,4.1l6.07,40.58c17.67,8.88,24.12,12.14,41.79,21.03l36.22-19.31c19.93,23.1,16.55,19.18,36.49,42.3l-24.39,32.98c6.2,18.78,8.48,25.63,14.69,44.42l39.24,11.94c-2.24,30.43-1.85,25.28-4.09,55.71Z"/>
    </symbol></defs></svg>

<header class="hero gutter">
  <svg class="ob-gear spin hero-gear-bg" viewBox="0 0 510 510" aria-hidden="true"><use href="#ob-gear"/></svg>
  <div class="wrap">
    <div>
      <span class="label"><svg class="ob-gear mark" viewBox="0 0 510 510" aria-hidden="true"><use href="#ob-gear"/></svg>Opsbook <span class="live-dot" aria-hidden="true"></span> Marketing</span>
      <h1>Content Desk</h1>
      <p class="lede">Review what the agents drafted. Approved posts go to Buffer and the blog on the scheduled day.</p>
    </div>
    <div class="weeknav">
      <button class="iconbtn" id="prev" aria-label="Previous week">&larr;</button>
      <div class="wk" id="wk">&nbsp;</div>
      <button class="iconbtn" id="next" aria-label="Next week">&rarr;</button>
    </div>
  </div>
</header>

<section class="band gutter" aria-label="Weekly cadence">
  <div class="wrap">
    <div class="label">Weekly cadence</div>
    <div class="summary" id="summary"></div>
  </div>
</section>

<main class="gutter">
  <div class="wrap">
    <div id="banner" class="banner" hidden></div>
    <section class="lane">
      <h2><span class="idx">01</span> Weekly blog post</h2>
      <div class="cards" id="blog"></div>
    </section>
    <section class="lane">
      <h2><span class="idx">02</span> Social · Mon / Wed / Fri</h2>
      <div class="cards social" id="social"></div>
    </section>
  </div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var items = [];          // [{id, ...data}]
  var canWrite = false;
  var db = null, user = null;
  var editing = {}, asking = {}, expanded = {};
  var state = { week: isoWeek(new Date()) };
  var SLOTS = ['Mon', 'Wed', 'Fri'];

  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    var y = t.getUTCFullYear();
    var w = Math.ceil((((t - Date.UTC(y, 0, 1)) / 86400000) + 1) / 7);
    return y + '-W' + String(w).padStart(2, '0');
  }
  function weekStart(key) {
    var y = +key.slice(0, 4), w = +key.slice(6);
    var jan4 = new Date(Date.UTC(y, 0, 4));
    var d = jan4.getUTCDay() || 7;
    var mon = new Date(jan4); mon.setUTCDate(jan4.getUTCDate() - d + 1 + (w - 1) * 7);
    return mon;
  }
  function shiftWeek(key, n) { var m = weekStart(key); m.setUTCDate(m.getUTCDate() + n * 7); return isoWeek(new Date(m.getUTCFullYear(), m.getUTCMonth(), m.getUTCDate())); }
  function fmt(d) { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 2200); }
  var LABEL = { pending: 'Needs review', approved: 'Approved', changes: 'Changes requested', rejected: 'Rejected' };

  function write(id, patch) {
    if (!db) return;
    patch.updatedAt = new Date().toISOString();
    db.collection('content').doc(id).update(patch).catch(function (e) {
      toast(e && e.code === 'not_granted' ? 'Only editors can change posts.' : 'Could not save. Try again.');
    });
  }
  function decide(it, status, note) {
    var p = { status: status, decidedAt: new Date().toISOString(), note: note || '' };
    if (user && user.id) { user.id().then(function (u) { p.decidedBy = u; write(it.id, p); }, function () { write(it.id, p); }); }
    else write(it.id, p);
    delete asking[it.id];
    toast(status === 'approved' ? 'Approved. The social agent can now schedule it.' : status === 'changes' ? 'Sent back with your note.' : status === 'rejected' ? 'Rejected.' : 'Moved back to review.');
  }

  function card(it) {
    var c = el('article', 'card'); c.dataset.status = it.status || 'pending'; c.dataset.kind = it.kind;
    var tag = el('div', 'index-tag'); var ix = el('span', 'idx', (it.kind === 'social' ? (it.slot || 'Post') : 'Blog').toUpperCase()); tag.appendChild(ix); tag.appendChild(document.createTextNode(' · ' + (it.kind === 'social' ? (it.channel || 'LinkedIn') : 'opsbook.ai'))); c.appendChild(tag);
    var top = el('div', 'top');
    var meta = el('div', 'meta');
    meta.appendChild(el('span', null, it.scheduledFor ? (it.kind === 'social' ? 'Posts ' : 'Publishes ') + it.scheduledFor : 'Unscheduled'));
    meta.appendChild(el('span', null, 'by ' + (it.author || 'agent')));
    top.appendChild(meta);
    top.appendChild(el('span', 'pill ' + (it.status || 'pending'), LABEL[it.status || 'pending']));
    c.appendChild(top);

    if (editing[it.id]) {
      var ti = el('input'); ti.type = 'text'; ti.id = 'ti-' + it.id; ti.value = it.title || ''; ti.setAttribute('aria-label', 'Title');
      var ta = el('textarea'); ta.id = 'ta-' + it.id; ta.value = it.body || ''; ta.setAttribute('aria-label', 'Body');
      c.appendChild(ti); c.appendChild(ta);
      var a = el('div', 'actions');
      var save = el('button', 'btn primary', 'Save edits');
      save.onclick = function () { write(it.id, { title: ti.value.trim(), body: ta.value, status: 'pending', note: '' }); delete editing[it.id]; toast('Saved. Back in review.'); };
      var cancel = el('button', 'btn', 'Cancel'); cancel.onclick = function () { delete editing[it.id]; render(); };
      a.appendChild(save); a.appendChild(cancel); c.appendChild(a);
      return c;
    }

    if (it.title) c.appendChild(el('h3', null, it.title));
    var long = (it.body || '').length > 420 && it.kind === 'blog';
    var b = el('div', 'body' + (long && !expanded[it.id] ? ' clamp' : ''), it.body || '');
    c.appendChild(b);
    if (long) { var m = el('button', 'more', expanded[it.id] ? 'Show less' : 'Read full draft'); m.onclick = function () { expanded[it.id] = !expanded[it.id]; render(); }; c.appendChild(m); }
    if (it.note && (it.status === 'changes' || it.status === 'rejected')) { var n = el('div', 'note'); n.appendChild(el('b', null, 'Your note')); n.appendChild(document.createTextNode(it.note)); c.appendChild(n); }

    if (asking[it.id]) {
      var q = el('textarea'); q.id = 'q-' + it.id; q.style.minHeight = '72px'; q.placeholder = 'What should change? The agent reads this note.'; q.setAttribute('aria-label', 'Change request');
      c.appendChild(q);
      var qa = el('div', 'actions');
      var send = el('button', 'btn primary', 'Send back'); send.onclick = function () { if (!q.value.trim()) { toast('Add a note first.'); return; } decide(it, 'changes', q.value.trim()); };
      var qc = el('button', 'btn', 'Cancel'); qc.onclick = function () { delete asking[it.id]; render(); };
      qa.appendChild(send); qa.appendChild(qc); c.appendChild(qa);
      return c;
    }

    var act = el('div', 'actions');
    if (!canWrite) { act.appendChild(el('span', 'meta', 'View only. Editors can approve.')); }
    else if (it.status === 'approved' || it.status === 'rejected') {
      var undo = el('button', 'btn', 'Move back to review'); undo.onclick = function () { decide(it, 'pending', ''); }; act.appendChild(undo);
    } else {
      var ap = el('button', 'btn primary', 'Approve'); ap.onclick = function () { decide(it, 'approved', ''); };
      var ch = el('button', 'btn', 'Request changes'); ch.onclick = function () { asking[it.id] = true; render(); };
      var ed = el('button', 'btn', 'Edit'); ed.onclick = function () { editing[it.id] = true; render(); };
      var rj = el('button', 'btn danger', 'Reject'); rj.onclick = function () { decide(it, 'rejected', ''); };
      act.appendChild(ap); act.appendChild(ch); act.appendChild(ed); act.appendChild(rj);
    }
    c.appendChild(act);
    return c;
  }

  function emptyState(title, text) { var e = el('div', 'empty'); e.appendChild(el('b', null, title)); e.appendChild(document.createTextNode(text)); return e; }

  function meter(list, total) {
    var m = el('div', 'meter');
    for (var i = 0; i < total; i++) {
      var s = list[i] && list[i].status; var cls = s === 'approved' ? 'ok' : s === 'changes' ? 'changes' : s ? 'pending' : '';
      m.appendChild(el('i', cls));
    }
    return m;
  }

  function render() {
    var start = weekStart(state.week), end = new Date(start); end.setUTCDate(end.getUTCDate() + 6);
    var wk = $('wk'); wk.textContent = state.week; wk.appendChild(el('small', null, fmt(start) + ' – ' + fmt(end) + (state.week === isoWeek(new Date()) ? ' · this week' : '')));
    var mine = items.filter(function (i) { return i.week === state.week; });
    var blogs = mine.filter(function (i) { return i.kind === 'blog'; });
    var socials = mine.filter(function (i) { return i.kind === 'social'; }).sort(function (a, b) { return SLOTS.indexOf(a.slot) - SLOTS.indexOf(b.slot); });

    var sm = $('summary'); sm.textContent = '';
    function tile(label, list, total) {
      var ok = list.filter(function (i) { return i.status === 'approved'; }).length;
      var t = el('div', 'sum'); t.appendChild(el('div', 'lbl', label));
      var v = el('div', 'val', String(ok)); v.appendChild(el('span', null, ' / ' + total + ' APPROVED')); t.appendChild(v); t.appendChild(meter(list, total)); return t;
    }
    sm.appendChild(tile('Blog post', blogs, 1));
    sm.appendChild(tile('Social posts', socials, 3));
    var waiting = mine.filter(function (i) { return (i.status || 'pending') === 'pending'; }).length;
    var t3 = el('div', 'sum'); t3.appendChild(el('div', 'lbl', 'Waiting on you')); var v3 = el('div', 'val', String(waiting)); v3.appendChild(el('span', null, waiting === 1 ? ' DRAFT' : ' DRAFTS')); t3.appendChild(v3);
    t3.appendChild(el('div', 'meta', waiting ? 'Review below' : 'Nothing to review')); sm.appendChild(t3);

    var bl = $('blog'); bl.textContent = '';
    if (blogs.length) blogs.forEach(function (i) { bl.appendChild(card(i)); });
    else bl.appendChild(emptyState('No blog draft for this week yet', 'The content agent adds the weekly post here. Ask the orchestrator: "draft this week\'s blog post".'));

    var so = $('social'); so.textContent = '';
    if (socials.length) socials.forEach(function (i) { so.appendChild(card(i)); });
    else so.appendChild(emptyState('No social drafts for this week yet', 'Three posts are expected, one each on Monday, Wednesday and Friday.'));
  }

  $('prev').onclick = function () { state.week = shiftWeek(state.week, -1); render(); };
  $('next').onclick = function () { state.week = shiftWeek(state.week, 1); render(); };
  render();

  (async function () {
    try {
      db = await claude.use('db'); user = await claude.use('user');
    } catch (e) { db = null; }
    if (!db) { var b = $('banner'); b.hidden = false; b.textContent = 'Sign in to the artifact to load and approve drafts.'; return; }
    try { canWrite = user ? await user.canEdit() : false; } catch (e) { canWrite = false; }
    var timer = setTimeout(function () { var b = $('banner'); b.hidden = false; b.textContent = 'Drafts are taking a while to load.'; }, 10000);
    db.collection('content').onSnapshot(function (snap) {
      clearTimeout(timer); $('banner').hidden = true;
      items = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; });
      // Land on the newest week with drafts if the current week has none.
      if (!state.touched) { state.touched = true; if (!items.some(function (i) { return i.week === state.week; }) && items.length) { state.week = items.map(function (i) { return i.week; }).sort().pop(); } }
      render();
    }, function () { clearTimeout(timer); var b = $('banner'); b.hidden = false; b.textContent = 'Could not load drafts.'; });
  })();
})();
</script>
